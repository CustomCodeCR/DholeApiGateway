name: Deploy Dhole API Gateway

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dhole-api-gateway-deploy
  cancel-in-progress: true

env:
  COMPOSE_FILE: /opt/dhole/docker-compose.services.yml

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]

    steps:
      - name: Checkout service
        uses: actions/checkout@v4

      - name: Verify server
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker network inspect dhole >/dev/null
          test -r /opt/dhole/.env
          test -r "$COMPOSE_FILE"
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" config -q

      - name: Build image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull \
            --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" \
            --secret id=github_token,env=GITHUB_TOKEN \
            -f Dhole.ApiGateway/Dockerfile \
            -t dhole/api-gateway:latest \
            -t "dhole/api-gateway:$SHA_TAG" \
            .

      - name: Deploy API Gateway
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" up -d --no-deps --force-recreate --pull never api-gateway
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" ps api-gateway

      - name: Cleanup old images
        run: docker image prune -f
