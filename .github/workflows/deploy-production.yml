name: Deploy Dhole API Gateway - Production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: dhole-api-gateway-production
  cancel-in-progress: false

env:
  COMPOSE_FILE: .dhole-system/deploy/docker-compose.services.yml
  DHOLE_IMAGE_TAG: latest
  DHOLE_NETWORK: dhole
  COMPOSE_PROJECT: dhole

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]

    steps:
      - name: Checkout service
        uses: actions/checkout@v4

      - name: Load Dhole deployment infrastructure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .dhole-system
          git clone --depth 1 --branch master https://github.com/CustomCodeCR/DholeSystem.git .dhole-system
          mkdir -p "$RUNNER_TEMP/dhole-env"
          bash .dhole-system/deploy/prepare-environments.sh /opt/dhole/.env "$RUNNER_TEMP/dhole-env"
          echo "DHOLE_ENV_FILE=$RUNNER_TEMP/dhole-env/.env.production" >> "$GITHUB_ENV"

      - name: Verify production server
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker network inspect "$DHOLE_NETWORK" >/dev/null
          test -r "$DHOLE_ENV_FILE"
          test -r "$COMPOSE_FILE"
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" config -q

      - name: Build image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull \
            --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" \
            --secret id=github_token,env=GITHUB_TOKEN \
            -f Dhole.ApiGateway/Dockerfile \
            -t dhole/api-gateway:latest \
            -t "dhole/api-gateway:$SHA_TAG" \
            .

      - name: Deploy API Gateway
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" up -d --no-deps --force-recreate --pull never api-gateway
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" ps api-gateway

      - name: Diagnose third-party storage after deployment (no secrets)
        shell: bash
        run: |
          set -euo pipefail
          ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" ps -q api-gateway)"
          if [[ -z "$ID" ]]; then
            echo "Gateway container is missing"
            exit 1
          fi
          LOG="$(docker logs --since 20m "$ID" 2>&1 || true)"
          if grep -q 'Third-party migration failed\|Third-party storage migration failed' <<< "$LOG"; then
            echo "::warning::Third-party database migration failed on master. Diagnosing SQLSTATE and exception type."
          else
            echo "No third-party migration failure was found in the most recent container logs."
          fi
          for code in 28P01 3D000 42501 42P07 42P06 42P01 23505 55006 57P03 08001 08006; do
            if grep -q "$code" <<< "$LOG"; then
              echo "PostgreSQL SQLSTATE: $code"
            fi
          done
          if grep -q 'Npgsql.PostgresException' <<< "$LOG"; then echo "Exception: Npgsql.PostgresException"; fi
          if grep -q 'Npgsql.NpgsqlException' <<< "$LOG"; then echo "Exception: Npgsql.NpgsqlException"; fi
          if grep -q 'SocketException' <<< "$LOG"; then echo "Exception: SocketException"; fi
          if grep -q 'TimeoutException\|Timeout during' <<< "$LOG"; then echo "Exception: timeout"; fi
          if grep -q 'role .* does not exist' <<< "$LOG"; then echo "PostgreSQL role missing"; fi
          if grep -q 'database .* does not exist' <<< "$LOG"; then echo "PostgreSQL database missing"; fi
          if grep -q 'relation .* already exists' <<< "$LOG"; then echo "PostgreSQL table conflict"; fi
          if grep -q 'password authentication failed' <<< "$LOG"; then echo "PostgreSQL authentication error"; fi
          if grep -q 'permission denied' <<< "$LOG"; then echo "PostgreSQL permission denied"; fi

      - name: Verify API Manager PostgreSQL storage ready
        shell: bash
        run: |
          set -euo pipefail
          ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" ps -q api-gateway)"
          LOG="$(docker logs --since 20m "$ID" 2>&1 || true)"
          if grep -q 'Third-party storage schema and EF migrations ready' <<< "$LOG"; then
            echo "API Manager PostgreSQL schema and migrations: READY"
          else
            echo "::error::API Manager PostgreSQL storage is not ready. Inspect sanitized SQLSTATE diagnostics."
            exit 1
          fi

      - name: Cleanup old images
        run: docker image prune -f
