name: Dhole Universal Version Policy

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dhole-version-policy:
    name: Dhole semantic version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate component, ecosystem, native binaries and changelog
        env:
          DH_VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python3 scripts/verify_dhole_version.py
