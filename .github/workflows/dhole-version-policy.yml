name: Dhole Universal Version Policy

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  dhole-version-policy:
    name: Dhole semantic version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate component, ecosystem, native binaries and changelog
        env:
          DH_VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python3 scripts/verify_dhole_version.py
      - name: Validate bundled service-version registry
        run: python3 scripts/verify_service_registry.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Authenticate private framework package feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: dotnet nuget update source github --username "$GITHUB_ACTOR" --password "$GH_TOKEN" --store-password-in-clear-text --configfile NuGet.Config
      - name: Compile and run API Gateway regressions
        run: dotnet test Dhole.ApiGateway.slnx --configuration Release --nologo
